version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: paddelstats-backend
    restart: unless-stopped
    runtime: nvidia          # Requiere NVIDIA Container Toolkit instalado en el host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Storage: local (default) o S3-compatible (Crusoe / AWS / Cloudflare R2)
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_BUCKET=${S3_BUCKET:-paddelstats}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_REGION=${S3_REGION:-auto}
      # Base de datos
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./paddelstats.db}
    volumes:
      - uploads:/app/uploaded_videos
      - runs:/app/runs
      - ./backend/court_config.json:/app/backend/court_config.json:ro
      - ./backend/tennis_ball_best.pt:/app/backend/tennis_ball_best.pt:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/videos"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro          # Certificados SSL (Let's Encrypt)
    depends_on:
      - backend

volumes:
  uploads:
  runs:
